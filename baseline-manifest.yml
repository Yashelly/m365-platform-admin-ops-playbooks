# Evidence policy:
# - Evidence maturity is tracked in STATUS.md (Captured / Partial / Planned).
# - Placeholders may be used to keep the structure reviewable while captures are planned.
# - Any captured evidence is sanitized to exclude tenant identifiers (UPNs, object IDs, domains, serials).

baseline:
  name: "Microsoft 365 Platform Administration – Ops Playbooks (Portfolio)"
  environment:
    tenant_scope: Microsoft 365 lab/sandbox tenant
    platform_scope:
      in_scope:
        - Exchange Online (mail flow, permissions, investigations)
        - Microsoft Teams (policies, troubleshooting)
        - SharePoint Online / OneDrive (permissions, sharing governance)
        - Microsoft Purview (retention/DLP/labels/audit as implemented)
        - Microsoft Defender for Office 365 (safe links/attachments, anti-phish triage)
        - ITIL-style operations (incident / request / change)
      out_of_scope:
        - Hybrid/AD synchronization deep-dive (intentionally excluded)
        - Deep Intune engineering baseline (covered in separate repository)
        - Third-party backup tools unless explicitly added
  rings:
    - id: R0
      name: R0 - Guardrails & Safety
      description: Safety notes, least-privilege, rollback discipline, and non-disruptive defaults
    - id: R1
      name: R1 - Pilot
      description: Small pilot scope for validation and controlled change
    - id: R2
      name: R2 - Broad
      description: Wider rollout / standard operations
    - id: R3
      name: R3 - Critical
      description: High-impact users/services; slowest change cadence and strict approvals

